prepare:
  test_size: 0.2
  random_state: 42
  sample_size: 100000
  max_attempt_count: 50

train:
  random_state: 42
  logreg:
    C: 1.0
    max_iter: 1000
    class_weight: "balanced"
  random_forest:
    n_estimators: 100
    max_depth: 10

# Kernel SVM stage (teacher-requested model). Training set is capped at
# sample_size because exact RBF-kernel SVM scales quadratically with rows.
svm:
  kernel: "rbf"
  C: 1.0
  gamma: "scale"
  sample_size: 30000
  random_state: 42

# Split-robustness and stratified k-fold cross-validation suite.
experiments:
  random_state: 42
  sample_size: 30000
  test_sizes:
    - 0.2
    - 0.3
    - 0.4
  cv_folds: 5
