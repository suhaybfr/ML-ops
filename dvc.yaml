stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - data/raw/skill_builder_data.csv
      - src/prepare.py
    params:
      - prepare.test_size
      - prepare.random_state
      - prepare.sample_size
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/train.py
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/train.py
      - src/utils.py
    params:
      - train.model_type
      - train.n_estimators
      - train.max_depth
      - train.random_state
    outs:
      - models/baseline_model.pkl
