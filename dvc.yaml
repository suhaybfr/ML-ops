stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - data/raw/skill_builder_data.csv
      - src/prepare.py
    params:
      - prepare.test_size
      - prepare.random_state
      - prepare.sample_size
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/train.py
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/train.py
      - src/utils.py
    params:
      - train.model_type
      - train.n_estimators
      - train.max_depth
      - train.random_state
    outs:
      - models/baseline_model.pkl

  train_svm:
    cmd: python src/train_svm.py
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/train_svm.py
      - src/utils.py
      - src/evaluation.py
    params:
      - svm.kernel
      - svm.C
      - svm.gamma
      - svm.sample_size
      - svm.random_state
    outs:
      - models/svm_model.pkl

  experiments:
    cmd: python src/experiments.py
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/experiments.py
      - src/utils.py
      - src/evaluation.py
    params:
      - experiments.random_state
      - experiments.sample_size
      - experiments.test_sizes
      - experiments.cv_folds
    outs:
      - reports/experiment_results.csv
      - reports/cv_results.csv
