# =============================================================================
#  Phase 2 CI/CD Pipeline — AI-Based Digital Learning Assistant
#  GitHub Actions Workflow
# =============================================================================
#
#  Jobs:
#    1. lint-and-test          -> flake8 + offline quality gate + unit PyTest
#    2. model-gate-and-registry -> DVC pull + live artifact quality gate +
#                                  real-model PyTest + MLflow Registry check
#    3. docker-build           -> build slim serving image + 11-feature /predict
#                                  smoke assertions on baseline_model.pkl
#    4. docker-push            -> push verified image to GHCR (& Docker Hub)
#    5. metrics-comment        -> post champion metrics & registry summary on PRs
#
#  Phase 3 drift/retrain jobs (`src/monitoring.py`, `src/retrain.py`) are
#  intentionally decoupled from push CI so static train/test splits do not spam
#  `drift_check_*` runs into the `student_performance_baseline` experiment.
# =============================================================================

name: MLOps CI/CD Pipeline

on:
  push:
    branches: [main, develop, "phase2*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: student-performance-predictor
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 ─ Lint, Offline Quality Gate & Unit PyTest
  # ─────────────────────────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit PyTest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src/ app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ app/ --count --max-line-length=100 --statistics --exit-zero

      - name: Run offline Model-Risk & Slice Quality Gate
        run: python -m src.validate_model

      - name: Run PyTest with coverage
        env:
          MLFLOW_OFFLINE: "1"
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=src \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=junit-report.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload JUnit test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-report
          path: junit-report.xml

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 ─ DVC Pull, Live Artifact Quality Gate & MLflow Registry Check
  # ─────────────────────────────────────────────────────────────────────────
  model-gate-and-registry:
    name: DVC Pull, Model Gate & Registry Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DAGsHub DVC remote credentials
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_PASSWORD: ${{ secrets.DAGSHUB_PASSWORD }}
        run: |
          if [ -z "$DAGSHUB_USERNAME" ] || [ -z "$DAGSHUB_PASSWORD" ]; then
            echo "DAGSHUB_USERNAME or DAGSHUB_PASSWORD secret is missing."
            exit 1
          fi
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USERNAME"
          dvc remote modify origin --local password "$DAGSHUB_PASSWORD"

      - name: Pull DVC-tracked models & evaluation partitions
        run: |
          dvc pull --no-run-cache \
            models/baseline_model.pkl \
            models/logreg_baseline.pkl \
            models/svm_model.pkl \
            data/processed/train.csv \
            data/processed/test.csv

      - name: Run full Model-Risk, Calibration & Artifact Latency Gate
        run: |
          python -m src.validate_model \
            --require-artifact \
            --output-json quality_gate_report.json

      - name: Run full PyTest suite against materialized DVC artifacts
        env:
          MLFLOW_OFFLINE: "1"
        run: pytest tests/ -v --tb=short

      - name: Verify Champion in DAGsHub MLflow Model Registry
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME || secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD || secrets.DAGSHUB_PASSWORD }}
        run: |
          python -m src.register_model --verify-only

          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from src.register_model import verify_registered_model

          with open("reports/baseline_metrics.json", encoding="utf-8") as f:
              base = json.load(f)
          rf = base["models"]["random_forest_baseline"]
          m = rf["metrics"]
          r = rf["risk_and_slice_diagnostics"]
          reg = verify_registered_model()

          print("## Phase 2 Champion Quality Gate & Registry Summary\n")
          print(f"- **Registered Model:** `{reg['model_name']}` `v{reg['version']}` (`status={reg['status']}`)")
          print(f"- **MLflow Run ID:** `{reg['run_id']}`")
          print(f"- **Artifact:** `{rf['artifact_path']}` (`engineered_11`)\n")
          print("| Metric | Score |")
          print("|---|---|")
          print(f"| Accuracy | {m['accuracy']:.4f} |")
          print(f"| F1-Score | {m['f1_score']:.4f} |")
          print(f"| Macro-F1 | {r['macro_f1']:.4f} |")
          print(f"| ROC-AUC | {m['roc_auc']:.4f} |")
          print(f"| MCC | {m['mcc']:.4f} |")
          print(f"| Brier Calibration | {r['brier_score']:.4f} |")
          print(f"| Class-0 Struggling Recall | {r['struggling_student_class0']['recall_specificity']:.4f} |")
          EOF

      - name: Upload DVC-pulled model artifacts for Docker jobs
        uses: actions/upload-artifact@v4
        with:
          name: champion-model-artifact
          path: |
            models/baseline_model.pkl
            models/logreg_baseline.pkl
            models/svm_model.pkl
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 ─ Docker Build & Real 11-Feature Container Smoke Test
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-test, model-gate-and-registry]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified model artifacts
        uses: actions/download-artifact@v4
        with:
          name: champion-model-artifact
          path: models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure image names
        id: image_names
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGES="ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME }}"
          if [ -n "$DOCKER_USER" ]; then
            IMAGES="$IMAGES,${DOCKER_USER}/${{ env.IMAGE_NAME }}"
          fi
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata / tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_names.outputs.images }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build slim serving Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container on real 11-feature Random Forest contract
        run: |
          set -euo pipefail
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d \
            --name predictor-test \
            -p 8000:8000 \
            -e MODEL_PATH=/app/models/baseline_model.pkl \
            "$IMAGE_TAG"

          trap 'docker logs predictor-test || true; docker rm -f predictor-test || true' EXIT

          READY=0
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health > /tmp/health.json 2>/dev/null; then
              READY=1
              break
            fi
            sleep 3
          done
          if [ "$READY" -ne 1 ]; then
            echo "Container failed readiness check within timeout."
            exit 1
          fi

          curl -sf http://localhost:8000/model/info > /tmp/model_info.json
          curl -sf http://localhost:8000/metrics > /tmp/metrics.txt

          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "log_opportunity": 2.5649,
              "attempt_count": 1.0,
              "hint_count": 0.0,
              "bottom_hint": 0,
              "hint_ratio": 0.0,
              "user_prev_acc": 0.88,
              "problem_difficulty": 0.80,
              "skill_difficulty": 0.75,
              "is_skill_unmapped": 0,
              "log_response_time": 9.35,
              "is_rapid_guess": 0
            }' > /tmp/pred_mastery.json

          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "log_opportunity": 0.6931,
              "attempt_count": 5.0,
              "hint_count": 3.0,
              "bottom_hint": 1,
              "hint_ratio": 1.0,
              "user_prev_acc": 0.25,
              "problem_difficulty": 0.28,
              "skill_difficulty": 0.38,
              "is_skill_unmapped": 0,
              "log_response_time": 10.60,
              "is_rapid_guess": 0
            }' > /tmp/pred_struggle.json

          python3 - <<'PYEOF'
          import json

          health = json.load(open("/tmp/health.json"))
          info = json.load(open("/tmp/model_info.json"))
          mastery = json.load(open("/tmp/pred_mastery.json"))
          struggle = json.load(open("/tmp/pred_struggle.json"))

          print("GET /health:", json.dumps(health))
          print("GET /model/info:", json.dumps(info))
          print("POST /predict (mastery):", json.dumps(mastery))
          print("POST /predict (struggle):", json.dumps(struggle))

          assert health["status"] == "ok" and health["model_loaded"] is True
          assert info["model_type"] == "RandomForestClassifier"
          assert info["feature_count"] == 11

          assert mastery["prediction"] == 1
          assert 0.5 <= mastery["probability"] <= 1.0
          assert mastery["needs_intervention"] is False
          assert mastery["model_version"] == "random_forest_baseline_v2"

          assert struggle["prediction"] == 0
          assert 0.0 <= struggle["probability"] < 0.5
          assert struggle["needs_intervention"] is True
          PYEOF

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4 ─ Push Container Image to GHCR / Docker Hub (main branch only)
  # ─────────────────────────────────────────────────────────────────────────
  docker-push:
    name: Push Image to Container Registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified model artifacts
        uses: actions/download-artifact@v4
        with:
          name: champion-model-artifact
          path: models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure image names
        id: image_names
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME }}"
          IMAGES="$GHCR_IMAGE"
          HAS_DOCKER="false"
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASS" ]; then
            IMAGES="$IMAGES,${DOCKER_USER}/${{ env.IMAGE_NAME }}"
            HAS_DOCKER="true"
          fi
          echo "ghcr_image=$GHCR_IMAGE" >> "$GITHUB_OUTPUT"
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "has_docker=$HAS_DOCKER" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub (if credentials provided)
        if: steps.image_names.outputs.has_docker == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_names.outputs.images }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest

      - name: Build & push Docker image (cached via Buildx)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write deployment summary
        run: |
          {
            echo "## Phase 2 Container Deployment Complete"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| **GHCR Image** | \`${{ steps.image_names.outputs.ghcr_image }}:latest\` |"
            echo "| **Champion Model** | \`models/baseline_model.pkl\` (\`random_forest_baseline_v2\`) |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo ""
            echo "### Run locally:"
            echo "\`\`\`bash"
            echo "docker pull ${{ steps.image_names.outputs.ghcr_image }}:latest"
            echo "docker run -p 8000:8000 ${{ steps.image_names.outputs.ghcr_image }}:latest"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 5 ─ Post PR Comment with Validated Champion Metrics & Registry Status
  # ─────────────────────────────────────────────────────────────────────────
  metrics-comment:
    name: Post PR Metrics Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: model-gate-and-registry
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-serving.txt

      - name: Build & post PR comment
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME || secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD || secrets.DAGSHUB_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          python - <<'PYEOF'
          import json
          from src.register_model import verify_registered_model

          with open("reports/baseline_metrics.json", encoding="utf-8") as f:
              base = json.load(f)
          rf = base["models"]["random_forest_baseline"]
          m = rf["metrics"]
          r = rf["risk_and_slice_diagnostics"]

          lines = [
              "## Phase 2 Model Quality Gate & Registry Summary",
              "",
              f"**Champion Artifact:** `{rf['artifact_path']}` (`engineered_11`, 11 leak-free features)",
          ]
          try:
              reg = verify_registered_model()
              lines.append(
                  f"**MLflow Registry:** `{reg['model_name']}` `v{reg['version']}` "
                  f"(run `{reg['run_id']}`, status `{reg['status']}`)"
              )
          except Exception as exc:
              lines.append(f"**MLflow Registry:** _verification skipped ({exc})_")

          lines.extend(
              [
                  "",
                  "| Metric | Value |",
                  "|---|---|",
                  f"| Accuracy | {m['accuracy']:.4f} |",
                  f"| F1-Score | {m['f1_score']:.4f} |",
                  f"| Macro-F1 | {r['macro_f1']:.4f} |",
                  f"| ROC-AUC | {m['roc_auc']:.4f} |",
                  f"| MCC | {m['mcc']:.4f} |",
                  f"| Brier Score | {r['brier_score']:.4f} |",
                  f"| Class-0 Struggling Recall | {r['struggling_student_class0']['recall_specificity']:.4f} |",
                  "",
                  "[View Experiment & Registry on DAGsHub MLflow](https://dagshub.com/suhaybfr/ML-ops.mlflow)",
              ]
          )
          body = "\n".join(lines) + "\n"
          with open("pr_comment.md", "w", encoding="utf-8") as out:
              out.write(body)
          print(body)
          PYEOF

          gh pr comment "$PR_NUMBER" --body-file pr_comment.md || \
            echo "Could not post PR comment (non-fatal)"
