global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'student-performance-mlops'

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # ── FastAPI prediction service ─────────────────────────────────────────────
  - job_name: 'student-predictor-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    authorization:
      type: Bearer
      credentials_file: /tmp/prometheus_token
    scrape_interval: 10s
    scrape_timeout: 8s

  # ── Prometheus self-monitoring ─────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
