# =============================================================================
#  docker-compose.yml — Phase 2 FastAPI Inference + Optional Phase 3 Profiles
# =============================================================================
#
#  Usage:
#    docker compose up --build                     # FastAPI service (+ /tutor when ENABLE_TUTOR=1)
#    docker compose --profile monitoring up -d     # API + Prometheus + Grafana
#    docker compose --profile full up --build -d   # Full stack (API + Monitoring)
#    docker compose down                           # Stop and remove containers
#
# =============================================================================

services:
  # ───────────────────────────────────────────────────────────────────────────
  # Phase 2 Core Service: FastAPI Student Performance Predictor (port 8000)
  # ───────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: student-performance-predictor:local
    container_name: mlops-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/baseline_model.pkl
      - MLFLOW_MODEL_URI=${MLFLOW_MODEL_URI:-}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME:-}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD:-}
      - PYTHONUNBUFFERED=1
      # Phase 3 conversational tutor (/tutor/*) — values come from the git-ignored .env
      - ENABLE_TUTOR=${ENABLE_TUTOR:-1}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      # Milestone 1 cloud persistence (optional — falls back to local CSV/Chroma when unset)
      - DATABASE_URL=${DATABASE_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-${SUPABASE_PDF_BUCKET:-course-pdfs}}
      # Milestone 3 security & Azure Blob artifact store (optional in local dev)
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
      - AZURE_STORAGE_CONTAINER=${AZURE_STORAGE_CONTAINER:-models}
    volumes:
      - ./models:/app/models
      - ./data/processed:/app/data/processed:ro
      # Persistent embedded ChromaDB vector store (survives container restarts).
      # Run `mkdir -p chroma_db reports/drift data/live` first so host owns the dirs.
      - ./chroma_db:/app/chroma_db
      - ./reports/drift:/app/reports/drift
      - ./data/live:/app/data/live
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; d = json.loads(urllib.request.urlopen('http://localhost:8000/health').read()); assert d.get('status') == 'ok' and d.get('model_loaded') is True",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - mlops-network

  # ───────────────────────────────────────────────────────────────────────────
  # Phase 3 Optional Profile (`monitoring` / `full`): Prometheus (port 9090)
  # ───────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: mlops-prometheus
    profiles: ["monitoring", "phase3", "full"]
    ports:
      - "9090:9090"
    environment:
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "printf '%s' \"$$ADMIN_API_KEY\" > /tmp/prometheus_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d --web.enable-lifecycle"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - mlops-network

  # ───────────────────────────────────────────────────────────────────────────
  # Phase 3 Optional Profile (`monitoring` / `full`): Grafana (port 3000)
  # ───────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: mlops-grafana
    profiles: ["monitoring", "phase3", "full"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/mlops_dashboard.json
      - GF_NEWS_NEWS_FEED_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - mlops-network

volumes:
  prometheus_data:
  grafana_data:

networks:
  mlops-network:
    name: mlops-network
